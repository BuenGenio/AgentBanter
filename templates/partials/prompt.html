<article data-search-block="prompt" class="prompt" id="{{ b.id }}">
  <div class="rail"><span class="n">{{ b.n }}</span></div>
  <div class="card">
    <div class="head"><span class="who">You</span><time datetime="{{ b.ts }}">{{ b.t }}</time></div>
    <div class="body md">{{ b.html|safe }}</div>
    <div class="chips" id="chips-{{ b.id }}">{% with stats = b.stats %}{% include "partials/chips.html" %}{% endwith %}</div>
  </div>
</article>
