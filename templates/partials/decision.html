<article data-search-block="decision" class="decision {{ b.source }}" id="{{ b.id }}">
  <div class="rail"><span class="dm">◆</span></div>
  <div class="card">
    <div class="head"><span class="tag">{{ b.source }}</span><time datetime="{{ b.ts }}">{{ b.t }}</time></div>
    {% if b.question %}<div class="q">{{ b.question }}</div>{% endif %}
    <div class="a">{{ b.answer }}</div>
  </div>
</article>
