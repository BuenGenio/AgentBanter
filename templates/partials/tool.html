<li class="tool {{ tool.icon }}{% if tool.result %} {{ 'ok' if tool.result.ok else 'err' }}{% endif %}" id="tool-{{ tool.id }}">
  <details>
    <summary>
      <span class="ico"></span>
      <span class="name">{{ tool.name }}</span>
      <span class="sum">{{ tool.summary }}</span>
      <span class="result" data-slot>{% if tool.result %}{% with r = tool.result %}{% include "partials/result.html" %}{% endwith %}{% endif %}</span>
      <time datetime="{{ tool.ts }}">{{ tool.t }}</time>
    </summary>
    {% if tool.detail %}<div class="input-inspector"><div class="code-caption">INPUT</div><pre class="detail"><code class="{{ 'language-javascript' if tool.name == 'exec' else 'language-bash' if tool.icon == 'bash' else '' }}">{{ tool.detail }}</code></pre></div>{% endif %}
    <div class="output-inspector" data-rslot>{% if tool.result %}<pre class="rdetail">{{ tool.result.detail }}</pre><script type="application/json" class="inspector-data">{{ tool.result.raw|tojson }}</script>{% endif %}</div>
  </details>
</li>
