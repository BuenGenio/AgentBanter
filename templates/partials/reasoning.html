<div class="reasoning" id="{{ b.id }}">
  <div class="rail"><span class="dot"></span></div>
  <details>
    <summary><span class="tag">thinking</span><span class="label">{{ b.label }}</span><time datetime="{{ b.ts }}">{{ b.t }}</time></summary>
    <div class="body md">{{ b.html|safe }}</div>
  </details>
</div>
