[package]
name = "claude-progress"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Live, readable view of Claude Code sessions: prompts, reasoning, tool steps and decisions"
license = "MIT"
repository = "https://github.com/BuenGenio/claude-progress"
readme = "README.md"
keywords = ["claude", "claude-code", "transcript", "viewer", "sse"]
categories = ["development-tools", "visualization"]

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
minijinja = { version = "2.24.0", features = ["loader", "builtins"] }
minijinja-autoreload = { version = "2.24.0", features = ["watch-fs"] }
pulldown-cmark = "0.13.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["fs"] }
